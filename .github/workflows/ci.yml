name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # The suite blocks sockets outright, so CI needs no API key and cannot be
      # broken by a Dota patch shifting the live meta.
      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      # The release version has one source of truth. Reading it here keeps a
      # version bump from silently skipping these checks against stale names.
      - name: Read the package version
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import re
          from pathlib import Path

          source = Path("src/dotameta/_version.py").read_text(encoding="utf-8")
          print("VERSION=" + re.search(r'__version__ = "([^"]+)"', source).group(1))
          PY

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Check artifact metadata and contents
        run: |
          python - <<'PY'
          import email
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          version = os.environ["VERSION"]
          sdist = tarfile.open(Path(f"dist/dotameta-{version}.tar.gz"))
          wheel = zipfile.ZipFile(Path(f"dist/dotameta-{version}-py3-none-any.whl"))
          sdist_names = sdist.getnames()
          wheel_names = wheel.namelist()
          assert not any("tests" in Path(name).parts for name in sdist_names)
          assert not any("tests" in Path(name).parts for name in wheel_names)
          assert any(name.endswith("dotameta/_version.py") for name in sdist_names)
          assert "dotameta/_version.py" in wheel_names

          pkg_info = next(name for name in sdist_names if name.endswith("/PKG-INFO"))
          metadata = next(name for name in wheel_names if name.endswith(".dist-info/METADATA"))
          sdist_version = email.message_from_bytes(sdist.extractfile(pkg_info).read())["Version"]
          wheel_version = email.message_from_bytes(wheel.read(metadata))["Version"]
          assert sdist_version == wheel_version == version
          PY

      # An editable install can hide a packaging mistake - a module left out of
      # either artifact, or a broken entry point - so install both cleanly.
      - name: Install artifacts into clean environments
        run: |
          python -m venv /tmp/from-wheel
          /tmp/from-wheel/bin/pip install dist/*.whl
          /tmp/from-wheel/bin/pip check
          /tmp/from-wheel/bin/python -c "import importlib.metadata, os, dotameta; assert dotameta.__version__ == importlib.metadata.version('dotameta') == os.environ['VERSION']"
          /tmp/from-wheel/bin/dotameta --help
          /tmp/from-wheel/bin/python -m dotameta --help
          python -m venv /tmp/from-sdist
          /tmp/from-sdist/bin/pip install dist/*.tar.gz
          /tmp/from-sdist/bin/pip check
          /tmp/from-sdist/bin/python -c "import importlib.metadata, os, dotameta; assert dotameta.__version__ == importlib.metadata.version('dotameta') == os.environ['VERSION']"
          /tmp/from-sdist/bin/dotameta --help
          /tmp/from-sdist/bin/python -m dotameta --help
