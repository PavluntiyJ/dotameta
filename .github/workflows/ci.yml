name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # The suite blocks sockets outright, so CI needs no API key and cannot be
      # broken by a Dota patch shifting the live meta.
      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      # An editable install can hide a packaging mistake - a module left out of
      # the wheel, or a broken entry point - so install the real artefact clean.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/pip check
          /tmp/fresh/bin/dotameta --help
          /tmp/fresh/bin/python -m dotameta --help
