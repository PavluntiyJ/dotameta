[project]
name = "dotameta"
description = "Dota 2 hero recommendations from OpenDota and optional Stratz data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pavel Jevstignejev" }]
requires-python = ">=3.11"
dynamic = ["version"]
keywords = ["dota2", "opendota", "mmr", "statistics", "gaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "requests>=2.32",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/PavluntiyJ/dotameta"
Repository = "https://github.com/PavluntiyJ/dotameta"
Issues = "https://github.com/PavluntiyJ/dotameta/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
dotameta = "dotameta.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Setuptools reads this literal without importing dotameta, and runtime imports
# the same value directly from the source module.
[tool.setuptools.dynamic]
version = { attr = "dotameta._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
